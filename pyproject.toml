[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-openai-proxy"
version = "0.1.4"
description = "Thin OpenAI-compatible API proxy backed by Anthropic Vertex AI"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "yaacov" }]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "anthropic[vertex]>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/yaacov/claude-openai-proxy"
Repository = "https://github.com/yaacov/claude-openai-proxy"

[project.scripts]
claude-openai-proxy = "claude_openai_proxy.__main__:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["claude_openai_proxy"]
